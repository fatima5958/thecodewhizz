<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember layout verification</title><style>*{box-sizing:border-box}body{margin:0;background:#303030;color:#eee;font:13px Arial,sans-serif}header{display:flex;gap:12px;align-items:center;justify-content:center;padding:16px;position:sticky;top:0;z-index:1;background:#303030}button,select{padding:10px;border:1px solid #666;border-radius:4px;background:#222;color:#eee;font:inherit}iframe{display:block;margin:0 auto 30px;border:1px solid #777;background:#141414}p{text-align:center;font-size:11px;color:#ccc}</style></head><body><header><label for="size">Viewport</label><select id="size"><option value="390,844">Phone 390 × 844</option><option value="360,640">Small phone 360 × 640</option><option value="768,1024">Tablet 768 × 1024</option><option value="1280,800">Desktop 1280 × 800</option></select><button data-place="0">Start</button><button data-place="0.5">Middle</button><button data-place="1">End</button><button data-place="menu">Menu</button></header><p>Responsive layout preview · actual page in a fixed-size viewport</p><iframe id="preview" title="Ember responsive preview" src="../restaurant-demo.html" width="390" height="844"></iframe><script>const frame=document.getElementById('preview');document.getElementById('size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');frame.width=w;frame.height=h;});document.querySelectorAll('[data-place]').forEach(b=>b.addEventListener('click',()=>{const win=frame.contentWindow,doc=frame.contentDocument;if(b.dataset.place==='menu'){doc.getElementById('menu').scrollIntoView({behavior:'instant'});return;}const section=doc.getElementById('experience'),stage=doc.getElementById('stage');win.scrollTo({top:section.offsetTop+(section.offsetHeight-stage.offsetHeight)*Number(b.dataset.place),behavior:'instant'});}));</script></body></html>
